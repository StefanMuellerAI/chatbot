name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - name: Abdeckungsmatrix (jede Einstellung, Route und Katalog-ID hat einen Test)
        run: npm run test:coverage
      - run: npm run build
        env:
          FREEBIE_MOCK: "1"

  e2e:
    name: E2E (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Playwright (Chat, Admin, API, Anbieter, Handy, Tablet, Belastung)
        run: npx playwright test
      - name: Bericht hochladen
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-chromium
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  e2e-browsers:
    name: E2E (Safari-Engine und Firefox)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Bis die ersten Läufe auf WebKit/Firefox grün waren, nur zur Information (lokal nicht prüfbar).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit firefox
      - run: npm run build
      - name: Chat-Tests in WebKit und Firefox
        run: npx playwright test --project=chat-webkit --project=chat-firefox
        env:
          E2E_BROWSERS: webkit,firefox
      - name: Bericht hochladen
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-browsers
          path: |
            playwright-report/
            test-results/
          retention-days: 14
